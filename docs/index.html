<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Balls</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2.3.1/dist/tonconnect-ui.min.js"></script>
  <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
</head>

<body>
  <canvas id="bg-waves" aria-hidden="true"></canvas>
  <div id="unity-container">
    <div id="stage">
      <canvas id="unity-canvas"></canvas>

      <div id="loader">
        <img id="logo" src="logo.png" alt="Logo" draggable="false" />
        <div id="progress-bar-wrapper">
          <div id="bubble-bar" aria-label="Loading progress">
            <div id="bubble-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          </div>
          <div id="loading-text">Loading...</div>
        </div>
      </div>

      <div id="tg-online-overlay" aria-hidden="true">
        <span id="tg-online-dot"></span>
        <span id="tg-online-count">-- online</span>
      </div>

      <div id="error-message">Unable to load the game. Please refresh the page.</div>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('tg-online-overlay');
      var countLabel = document.getElementById('tg-online-count');

      function isTelegramMobile() {
        if (typeof Telegram === 'undefined' || !Telegram.WebApp) return false;
        var p = Telegram.WebApp.platform;
        return p === 'android' || p === 'ios';
      }

      function updateSafeArea() {
        var root = document.documentElement;
        var cssSafe = parseFloat(getComputedStyle(root).getPropertyValue('--sat')) || 0;
        var tgSafe = 0;
        if (typeof Telegram !== 'undefined' && Telegram.WebApp && Telegram.WebApp.safeAreaInset) {
          tgSafe = Telegram.WebApp.safeAreaInset.top || 0;
        }
        var top = Math.max(cssSafe, tgSafe);
        root.style.setProperty('--tg-safe-top', top + 'px');
      }

      function updateVisibility() {
        if (!overlay) return;
        overlay.style.display = isTelegramMobile() ? 'flex' : 'none';
      }

      window.setOnlineCount = function (count) {
        if (!countLabel) return;
        var n = parseInt(count, 10);
        if (!isFinite(n)) return;
        countLabel.textContent = n + ' online';
        updateSafeArea();
        updateVisibility();
      };

      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.onEvent('safeAreaChanged', updateSafeArea);
        Telegram.WebApp.onEvent('viewportChanged', updateSafeArea);
      }
      window.addEventListener('resize', updateSafeArea);

      updateSafeArea();
      updateVisibility();
    })();
  </script>
  <script>
    const cacheBuster = `?v=${Date.now()}`;
    document.write(`<script src="Build/Balls.loader.js${cacheBuster}"><\/script>`);
  </script>
  <script src="unityLoader.js"></script>
</body>

</html>
